<!doctype html>
<html lang="az">
<head>
    <meta charset="utf-8">
    <title>Parfumshop → Ferrum</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="top">
    <div class="brand">
        <img src="icons/icon32.png" alt="" width="22" height="22">
        <span>Parfumshop <b>→</b> Ferrum</span>
    </div>
    <button type="button" class="icon-btn" id="settingsToggle" aria-label="Ayarlar" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </button>
</header>

<section class="settings" id="settings" hidden>
    <label for="site">Sayt</label>
    <select id="site"></select>
    <p class="hint">Məlumat bu saytın admin panelindən çəkilir. Orada admin kimi daxil olmalısınız.</p>
</section>

<form class="search" id="searchForm" autocomplete="off">
    <input id="orderRef" name="ref" type="text" inputmode="text" placeholder="Sifariş nömrəsi (PS…) və ya ID" maxlength="30" required>
    <button type="submit" class="btn btn-primary" id="searchBtn">Çək</button>
</form>

<main id="view">
    <div class="empty">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 3h6l1 4H8l1-4Z"/><path d="M8 7h8l1 13a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L8 7Z"/></svg>
        <p>Sifariş nömrəsini yazın — müştəri, kredit və məhsul məlumatları burada görünəcək.</p>
    </div>
</main>

<footer class="actions" id="actions" hidden>
    <button type="button" class="btn btn-ghost" id="clearBtn">Təmizlə</button>
    <button type="button" class="btn btn-primary" id="fillBtn" disabled>Ferrum-a doldur</button>
    <p class="hint" id="fillHint"></p>
</footer>

<script type="module" src="popup.js"></script>
</body>
</html>
